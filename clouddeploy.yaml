apiVersion: deploy.cloud.google.com/v1
kind: CustomTargetType
metadata:
  name: firebase-hosting
customActions:
  deployAction: firebase-hosting-deploy
---
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: portfolio
serialPipeline:
  stages:
    - targetId: portfolio-staging
    - targetId: portfolio-production
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: portfolio-staging
requireApproval: false
executionConfigs:
  - usages: [RENDER, DEPLOY]
    serviceAccount: deploy-runner@strata-org.iam.gserviceaccount.com
customTarget:
  customTargetType: firebase-hosting
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: portfolio-production
requireApproval: true
executionConfigs:
  - usages: [RENDER, DEPLOY]
    serviceAccount: deploy-runner@strata-org.iam.gserviceaccount.com
customTarget:
  customTargetType: firebase-hosting
