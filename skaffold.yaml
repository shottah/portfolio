apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: portfolio
customActions:
  - name: firebase-hosting-deploy
    containers:
      - name: deploy
        image: gcr.io/google.com/cloudsdktool/cloud-sdk
        command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail

            # Locate source tarball via Cloud Deploy API
            SOURCE_URI=$(gcloud deploy releases describe "$CLOUD_DEPLOY_RELEASE" \
              --delivery-pipeline="$CLOUD_DEPLOY_DELIVERY_PIPELINE" \
              --region="$CLOUD_DEPLOY_LOCATION" \
              --project="$CLOUD_DEPLOY_PROJECT" \
              --format="value(skaffoldConfigUri)" | cut -d'#' -f1)

            echo "Downloading source from $SOURCE_URI"
            gsutil cp "$SOURCE_URI" /tmp/source.tgz
            mkdir -p /app && tar -xzf /tmp/source.tgz -C /app
            cd /app

            # Install Node.js 22
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null
            apt-get install -y nodejs > /dev/null 2>&1

            # Install deps and deploy
            npm install -g firebase-tools

            # Patch firebase-tools: SHARP_VERSION "^0.32 || ^0.33" excludes ^0.34 which
            # Next.js 15.3+ requires. npm ci then fails because 0.34.x doesn't satisfy
            # the constraint. Adding ^0.34 fixes the lockfile/package.json mismatch.
            CONSTANTS="$(npm root -g)/firebase-tools/lib/frameworks/constants.js"
            sed -i 's/exports\.SHARP_VERSION = "\^0\.32 || \^0\.33"/exports.SHARP_VERSION = "^0.32 || ^0.33 || ^0.34"/' "$CONSTANTS"

            firebase experiments:enable webframeworks
            corepack enable pnpm
            pnpm install --frozen-lockfile
            firebase deploy --only hosting \
              --project "$CLOUD_DEPLOY_PROJECT" \
              --non-interactive
