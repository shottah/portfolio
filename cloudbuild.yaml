steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: create-release
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - release-$SHORT_SHA
      - --delivery-pipeline=portfolio
      - --region=us-central1
      - --project=strata-org
      - --source=.
      - --skaffold-file=skaffold.yaml

options:
  logging: LEGACY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
